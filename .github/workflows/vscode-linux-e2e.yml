name: VS Code Linux end-to-end

# Runs Microsoft's real VS Code .deb packages through the Linux firewall's update remediation: apt
# and dpkg upgrades and downgrades (the dpkg hook), the path unit, the timer, and removal.
# See package-firewall/tests/e2e-vscode-linux.sh.

on:
  pull_request:
    paths:
      - package-firewall/bash/generate.sh
      - package-firewall/bash/templates/vscode.sh
      - package-firewall/bash/templates/remove.sh
      - package-firewall/tests/e2e-vscode-linux.sh
      - .github/workflows/vscode-linux-e2e.yml
  push:
    branches: [main]
    paths:
      - package-firewall/bash/generate.sh
      - package-firewall/bash/templates/vscode.sh
      - package-firewall/bash/templates/remove.sh
      - package-firewall/tests/e2e-vscode-linux.sh
      - .github/workflows/vscode-linux-e2e.yml
  schedule:
    # Weekly, to catch new VS Code releases and runner image updates.
    - cron: '53 7 * * 1'
  workflow_dispatch:
    inputs:
      old_version:
        description: 'VS Code version to start from (default: newest release of the minor before new_version)'
        required: false
        default: ''
      new_version:
        description: 'VS Code version to update to (default: latest stable)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  e2e:
    name: VS Code e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run the end-to-end test
        env:
          ENDOR_E2E_OLD_VERSION: ${{ inputs.old_version }}
          ENDOR_E2E_NEW_VERSION: ${{ inputs.new_version }}
          ENDOR_E2E_ARTIFACTS: ${{ runner.temp }}/vscode-e2e-artifacts
        run: bash package-firewall/tests/e2e-vscode-linux.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vscode-e2e-${{ matrix.os }}
          path: ${{ runner.temp }}/vscode-e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14
